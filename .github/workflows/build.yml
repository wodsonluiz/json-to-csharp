name: Build and Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests, SCA and VSIX
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - run: npm ci --ignore-scripts
      - name: Block High and Critical dependencies (including build tools)
        run: npm run audit:security
      - run: npm run build
      - run: npm test
      - run: npm run package
      - run: npm run check:vsix
      - run: sha256sum extension.vsix > extension.vsix.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-vsix
          path: |
            extension.vsix
            extension.vsix.sha256
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: bash scripts/install-gitleaks.sh
      - name: Scan all fetched Git history
        run: gitleaks git --redact --no-banner .
      - name: Scan tracked working tree
        run: git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/scan-source"
        # Directory created by the installation step. No repository exclusions.
      - run: gitleaks dir --redact --no-banner "$RUNNER_TEMP/scan-source"

  sast:
    name: CodeQL security gate
    permissions:
      contents: read
      security-events: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: sarif-results
          upload: never
          upload-database: false
      - run: node scripts/check-sarif.cjs sarif-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results/*.sarif
          if-no-files-found: error
          retention-days: 7

  package-security:
    name: Packaged secret scanning
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-vsix
      - run: bash scripts/install-gitleaks.sh
      - run: sha256sum --check --strict extension.vsix.sha256
      - run: unzip -q extension.vsix -d "$RUNNER_TEMP/vsix-content"
      - run: gitleaks dir --redact --no-banner "$RUNNER_TEMP/vsix-content"

  quality:
    name: Quality gate
    if: always()
    needs: [build, secrets, sast, package-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=Object.values(JSON.parse(process.env.RESULTS)); if(jobs.length!==4 || jobs.some(j=>j.result!=="success")) process.exit(1)'
